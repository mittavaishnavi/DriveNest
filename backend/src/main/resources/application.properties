
spring.application.name=backend

# Online MySQL database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${PORT:7077}

# JWT
app.jwt.secret=${APP_JWT_SECRET}

# Admin
app.admin.email=${ADMIN_EMAIL:admin@drivenest.com}
app.admin.password=${ADMIN_PASSWORD}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:7050}

# Logging
logging.level.org.springframework.security=INFO
